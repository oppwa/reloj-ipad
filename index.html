<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Dashboard Cusco</title>
  <style>
    * { 
      -webkit-box-sizing: border-box; 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0a0e17;
      color: #ffffff;
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Fondo con gradiente animado */
    #bg-layer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #0a0e17 0%, #1a1f35 50%, #0a0e17 100%);
      z-index: 1;
      animation: gradientShift 20s ease infinite;
    }

    @keyframes gradientShift {
      0% { background: linear-gradient(135deg, #0a0e17 0%, #1a1f35 50%, #0a0e17 100%); }
      50% { background: linear-gradient(135deg, #1a1f35 0%, #0a0e17 50%, #1a1f35 100%); }
      100% { background: linear-gradient(135deg, #0a0e17 0%, #1a1f35 50%, #0a0e17 100%); }
    }

    /* Efecto de partículas o estrellas */
    .stars {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 2;
      background-image: 
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.3), transparent),
        radial-gradient(2px 2px at 40% 70%, rgba(255,255,255,0.2), transparent),
        radial-gradient(2px 2px at 60% 40%, rgba(255,255,255,0.3), transparent),
        radial-gradient(2px 2px at 80% 80%, rgba(255,255,255,0.2), transparent),
        radial-gradient(2px 2px at 30% 90%, rgba(255,255,255,0.25), transparent),
        radial-gradient(2px 2px at 70% 20%, rgba(255,255,255,0.2), transparent);
      animation: twinkle 3s ease infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .container {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    /* Reloj Digital Principal */
    .clock-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .digital-clock {
      font-size: 9rem;
      font-weight: 100;
      letter-spacing: -4px;
      line-height: 1;
      text-shadow: 
        0 0 20px rgba(56, 189, 248, 0.5),
        0 0 40px rgba(56, 189, 248, 0.3),
        0 0 60px rgba(56, 189, 248, 0.2);
      animation: clockGlow 2s ease-in-out infinite;
    }

    .digital-clock .seconds {
      font-size: 4rem;
      color: #38bdf8;
      margin-left: 8px;
    }

    .digital-clock .ampm {
      font-size: 3rem;
      color: #94a3b8;
      margin-left: 15px;
      vertical-align: super;
    }

    @keyframes clockGlow {
      0%, 100% { text-shadow: 0 0 20px rgba(56, 189, 248, 0.5), 0 0 40px rgba(56, 189, 248, 0.3); }
      50% { text-shadow: 0 0 30px rgba(56, 189, 248, 0.8), 0 0 60px rgba(56, 189, 248, 0.5); }
    }

    .date-info {
      font-size: 1.8rem;
      color: #94a3b8;
      margin-top: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Sección de Calendario y Tipo de Cambio */
    .info-section {
      display: flex;
      gap: 40px;
      align-items: center;
      margin-top: 20px;
    }

    /* Calendario */
    .calendar-card {
      width: 280px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      overflow: hidden;
      text-align: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .cal-header {
      background: linear-gradient(135deg, #e11d48 0%, #ef4444 100%);
      color: #ffffff;
      font-weight: bold;
      font-size: 2rem;
      padding: 15px 0;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .cal-day-num {
      color: #ffffff;
      font-size: 7rem;
      font-weight: 800;
      line-height: 1;
      padding: 20px 0 10px 0;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
    }

    .cal-day-name {
      color: #38bdf8;
      font-size: 1.8rem;
      font-weight: 500;
      text-transform: uppercase;
      padding-bottom: 20px;
      letter-spacing: 2px;
    }

    /* Widget de Tipo de Cambio */
    .exchange-card {
      width: 280px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .exchange-title {
      font-size: 1.5rem;
      color: #94a3b8;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .exchange-rate {
      font-size: 4.5rem;
      font-weight: 700;
      color: #10b981;
      text-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
      margin-bottom: 15px;
    }

    .exchange-symbol {
      font-size: 1.8rem;
      color: #94a3b8;
    }

    .exchange-update {
      font-size: 1rem;
      color: #64748b;
      margin-top: 15px;
    }

    /* Saludo */
    .greeting-box {
      font-size: 2.2rem;
      font-weight: 300;
      color: #38bdf8;
      margin-top: 30px;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      letter-spacing: 1px;
    }

    /* Responsive para pantallas más pequeñas */
    @media (max-width: 768px) {
      .digital-clock {
        font-size: 6rem;
      }
      .digital-clock .seconds {
        font-size: 3rem;
      }
      .info-section {
        flex-direction: column;
        gap: 20px;
      }
      .calendar-card, .exchange-card {
        width: 250px;
      }
      .cal-day-num {
        font-size: 5rem;
      }
      .exchange-rate {
        font-size: 3.5rem;
      }
    }
  </style>
</head>
<body>

  <div id="bg-layer"></div>
  <div class="stars"></div>

  <div class="container">
    <!-- Reloj Digital -->
    <div class="clock-section">
      <div class="digital-clock">
        <span id="hours-mins">00:00</span>
        <span class="seconds" id="secs">:00</span>
        <span class="ampm" id="ampm">AM</span>
      </div>
      <div class="date-info" id="date-info">Lunes, 1 de Enero</div>
    </div>

    <!-- Calendario y Tipo de Cambio -->
    <div class="info-section">
      <div class="calendar-card">
        <div class="cal-header" id="cal-month">Enero</div>
        <div class="cal-day-num" id="cal-day">1</div>
        <div class="cal-day-name" id="cal-weekday">Lunes</div>
      </div>

      <div class="exchange-card">
        <div class="exchange-title">USD/PEN</div>
        <div class="exchange-rate">
          <span class="exchange-symbol">S/ </span>
          <span id="exchange-rate">--.--</span>
        </div>
        <div class="exchange-update" id="exchange-update">Actualizando...</div>
      </div>
    </div>

    <!-- Saludo -->
    <div class="greeting-box" id="greeting">¡Hola Wali! 👋</div>
  </div>

  <script>
    function pad(n) { return n < 10 ? '0' + n : n; }

    var meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    var diasSemana = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

    // 1. Reloj y Calendario
    function updateDateTime() {
      var now = new Date();
      
      // Reloj
      var hours = now.getHours();
      var ampm = hours >= 12 ? 'PM' : 'AM';
      var hours12 = hours % 12;
      if (hours12 === 0) hours12 = 12;
      
      document.getElementById('hours-mins').innerHTML = pad(hours12) + ':' + pad(now.getMinutes());
      document.getElementById('secs').innerHTML = ':' + pad(now.getSeconds());
      document.getElementById('ampm').innerHTML = ampm;

      // Fecha completa
      document.getElementById('date-info').innerHTML = 
        diasSemana[now.getDay()] + ', ' + now.getDate() + ' de ' + meses[now.getMonth()] + ' de ' + now.getFullYear();

      // Calendario
      document.getElementById('cal-month').innerHTML = meses[now.getMonth()];
      document.getElementById('cal-day').innerHTML = now.getDate();
      document.getElementById('cal-weekday').innerHTML = diasSemana[now.getDay()];
    }
    
    setInterval(updateDateTime, 1000);
    updateDateTime();

    // 2. Tipo de Cambio USD/PEN
    var exchangeRate = null;
    var lastUpdate = null;

    function loadExchangeRate() {
      // Verificar si ya tenemos una tasa guardada de hoy
      var savedRate = localStorage.getItem('usd_pen_rate');
      var savedDate = localStorage.getItem('usd_pen_date');
      var today = new Date().toDateString();

      if (savedRate && savedDate === today) {
        // Usar tasa guardada de hoy
        exchangeRate = parseFloat(savedRate);
        displayExchangeRate();
        return;
      }

      // Si no hay tasa de hoy, intentar obtenerla de la API
      fetchExchangeRate();
    }

    function fetchExchangeRate() {
      // Usando exchangerate-api.com (gratis, sin key para uso básico)
      var url = 'https://open.er-api.com/v6/latest/USD';
      
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              if (data && data.rates && data.rates.PEN) {
                exchangeRate = data.rates.PEN;
                // Guardar en localStorage
                localStorage.setItem('usd_pen_rate', exchangeRate);
                localStorage.setItem('usd_pen_date', new Date().toDateString());
                displayExchangeRate();
              }
            } catch(err) {
              showExchangeError();
            }
          } else {
            showExchangeError();
          }
        }
      };
      xhr.send();
    }

    function displayExchangeRate() {
      if (exchangeRate) {
        document.getElementById('exchange-rate').innerHTML = exchangeRate.toFixed(2);
        
        var now = new Date();
        var updateTime = pad(now.getHours()) + ':' + pad(now.getMinutes());
        document.getElementById('exchange-update').innerHTML = 'Actualizado: ' + updateTime;
      }
    }

    function showExchangeError() {
      document.getElementById('exchange-rate').innerHTML = '--.--';
      document.getElementById('exchange-update').innerHTML = 'No disponible';
      
      // Reintentar en 30 minutos
      setTimeout(fetchExchangeRate, 1800000);
    }

    // Programar actualización automática a las 6 AM
    function scheduleNextUpdate() {
      var now = new Date();
      var nextUpdate = new Date(now);
      nextUpdate.setHours(6, 0, 0, 0);
      
      if (nextUpdate <= now) {
        nextUpdate.setDate(nextUpdate.getDate() + 1);
      }
      
      var timeUntilUpdate = nextUpdate - now;
      console.log('Próxima actualización: ' + nextUpdate);
      console.log('En ' + Math.round(timeUntilUpdate / 1000 / 60) + ' minutos');
      
      setTimeout(function() {
        fetchExchangeRate();
        // Programar la siguiente actualización
        scheduleNextUpdate();
      }, timeUntilUpdate);
    }

    // Cargar tipo de cambio inicial
    loadExchangeRate();
    
    // Programar actualizaciones diarias
    scheduleNextUpdate();

    // 3. Saludos
    var greetings = [
      "¡Hola Wali! 👋",
      "¡Hola Allison! 😊",
      "¡Hola Wali y Allison! ✨",
      "Que tengan un gran día ☕",
      "Hola Wali 🚀",
      "Hola Allison 🌸"
    ];

    function rotateGreeting() {
      var greetElem = document.getElementById('greeting');
      greetElem.style.opacity = '0';
      
      setTimeout(function() {
        var gIndex = Math.floor(Math.random() * greetings.length);
        greetElem.innerHTML = greetings[gIndex];
        greetElem.style.opacity = '1';
      }, 1000);
    }
    
    setInterval(rotateGreeting, 30000); // Cambia cada 30 segundos

    // 4. Efecto de brillo en el reloj cada segundo
    function pulseClock() {
      var clock = document.querySelector('.digital-clock');
      clock.style.transform = 'scale(1.02)';
      setTimeout(function() {
        clock.style.transform = 'scale(1)';
      }, 100);
    }
    
    setInterval(pulseClock, 1000);
  </script>
</body>
